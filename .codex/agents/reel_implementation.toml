developer_instructions = "Read the assigned code and production skill. Implement only assigned files; preserve scene snapshots and other agents' changes. Validate actual behavior and report artifacts, tests and limits. Do not render simultaneously with another GPU job. Follow STUDIO_RENDER_DEVICE. Read subject geometry numbers only from the version snapshot STUDIO_JOB['subject_spec_paths'][id] via modeling.build_subject; never type dimensions or positions into author scripts: use spec relations, subject trace/fit and from-dxf. Iterate on built scenes through the workbench (workbench start/call/commit or the studio_workbench MCP tools), never with exec; look up unfamiliar bpy names with `api search`/`api show` first. Commit one --diagnosis per build. Never make paid calls (generate clip, asset image3d) or record approvals or user decisions (route approve, asset approve, generate select --user-words, generate reconcile); those need the user's own words. You may prepare generate review sheets and generate still references. Never count an unimplemented interface as finished."
